plugins {
    id "maven-publish"
}

boolean obfuscatedMinecraft = !project.property('dependencies.minecraft_version').toString().startsWith('26.')
apply plugin: obfuscatedMinecraft ? "net.fabricmc.fabric-loom-remap" : "net.fabricmc.fabric-loom"
apply plugin: "com.replaymod.preprocess"

int mcVersion = 0
preprocess {
    mcVersion = vars.get().get("MC")
    vars.put("MC", mcVersion)
}

int javaVersion = project.property('java_version') as int

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-mc${project.property('dependencies.minecraft_version')}"
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        betterwayland {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.property('dependencies.minecraft_version')}"
    if (mcVersion < 260000) {
        mappings loom.layered {
            officialMojangMappings()
        }
    }
    if (obfuscatedMinecraft) {
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    }

    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.property('dependencies.minecraft_version')
    inputs.property "minecraft_dependency", project.property('minecraft_dependency')
    inputs.property "java_version", javaVersion
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.property('dependencies.minecraft_version'),
                "minecraft_dependency": project.property('minecraft_dependency'),
                "java_version": javaVersion
    }
    filesMatching("betterwayland.mixins.json") {
        expand "java_version": javaVersion,
                "platform_preference_mixin": mcVersion >= 260100
                        ? ',\n    "SharedConstantsMixin"'
                        : '',
                "text_input_mixins": mcVersion >= 260100
                        ? ',\n    "MinecraftTextInputMixin",\n    "KeyboardPreeditMixin",\n    "TextInputManagerMixin",\n    "IMEPreeditOverlayMixin",\n    "GuiMixin"'
                        : ''
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaVersion
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${project.name}" }
    }
    from(rootProject.file("LICENSES/GPL-3.0-only.txt")) {
        rename { "GPL-3.0_${project.name}.txt" }
    }
    from(rootProject.file("THIRD_PARTY_NOTICES.md")) {
        rename { "${it}_${project.name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
